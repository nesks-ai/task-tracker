<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F6F3">
<title>OQ Register</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9A%96%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --b:#F7F6F3; --s:#FFFFFF; --s2:#F5F3EF; --s3:#FCFBF9; --d:#E4E1DA; --d2:#D3CFC6;
  --t:#1B1E23; --m:#6A7280; --dm:#9AA1AB; --h:#FAF9F6; --hb:rgba(247,246,243,0.86);
  --g:#1F8A54; --onG:#FFFFFF; --gb:#EDF7F1; --gd:#C6E5D2;
  --a:#B4690E; --ab:#FDF6E8; --abh:#FBF0DA; --ad:#EAD6AC;
  --p:#6D3FD1; --pb:#F5F1FD; --pd:#DFD3F7;
  --u:#2563EB; --ub:#EDF3FE; --ud:#CFDFFB;
  --r:#B4433B; --rd:#EBCFCC;
}
:root[data-theme="dark"]{
  --b:#0C0E12; --s:#14181F; --s2:#1A1F27; --s3:#11151B; --d:#252C36; --d2:#333C48;
  --t:#E7EDF4; --m:#94A0B0; --dm:#6B7683; --h:#1A1F27; --hb:rgba(12,14,18,0.86);
  --g:#4FD189; --onG:#0C0E12; --gb:#12241B; --gd:#1F4030;
  --a:#EFAE4B; --ab:#231B0F; --abh:#2B2113; --ad:#4A3A1C;
  --p:#B39BFA; --pb:#1B1730; --pd:#332A54;
  --u:#7FB0FF; --ub:#101B2C; --ud:#22344F;
  --r:#E8827A; --rd:#40272A;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html{background:var(--b)}
body{margin:0; background:var(--b); color:var(--t);
  font:400 14px/1.5 "IBM Plex Sans",sans-serif}
button{font-family:inherit; cursor:pointer}
input,textarea{font-family:inherit}
.mono{font-family:"IBM Plex Mono",monospace}
.wrap{max-width:1120px; margin:0 auto; padding:0 32px 96px}
@keyframes oqfade{from{opacity:0; transform:translateY(-4px)}to{opacity:1; transform:none}}

/* ---------- header ---------- */
header{position:sticky; top:0; z-index:20; backdrop-filter:blur(14px);
  background:var(--hb); border-bottom:1px solid var(--d)}
.hrow{max-width:1120px; margin:0 auto; padding:18px 32px 0; display:flex; gap:20px; align-items:center}
.htitle{font:700 22px "Space Grotesk",sans-serif; letter-spacing:-0.02em; color:var(--t)}
.hsync{font:400 11px "IBM Plex Mono",monospace; text-transform:uppercase; letter-spacing:0.06em; color:var(--dm)}
.hspace{flex:1}
.prog{border:1px solid var(--d); border-radius:10px; background:var(--s); padding:8px 14px}
.prog .pl{font-size:11px; color:var(--m); margin-bottom:4px; display:flex; gap:10px; align-items:center}
.ptrack{width:104px; height:5px; border-radius:99px; background:var(--s2); overflow:hidden}
.pfill{height:100%; background:var(--g); border-radius:99px}
.pcount{font:500 12px "IBM Plex Mono",monospace; color:var(--g)}
.ibtn{width:38px; height:38px; border-radius:10px; border:1px solid var(--d); background:var(--s);
  color:var(--m); font-size:16px; flex-shrink:0}
.ibtn:hover{border-color:var(--d2); color:var(--t)}
.tabs{max-width:1120px; margin:0 auto; padding:0 32px; display:flex; gap:4px}
.tab{border:none; background:none; padding:10px 14px 12px; font:600 14px "IBM Plex Sans",sans-serif;
  color:var(--m); border-bottom:2px solid transparent; display:flex; gap:7px; align-items:center}
.tab[aria-selected="true"]{color:var(--t); border-bottom-color:var(--t)}
.tab .cnt{font:400 11px "IBM Plex Mono",monospace; padding:2px 6px; border-radius:5px; background:var(--s2); color:var(--m)}

/* ---------- needs-you strip ---------- */
.strip{margin-top:28px; border:1px solid var(--ad); border-radius:14px; background:var(--ab); overflow:hidden}
.striphead{padding:14px 20px 12px; border-bottom:1px solid var(--ad); display:flex; gap:10px; align-items:center}
.stripdot{width:7px; height:7px; border-radius:99px; background:var(--a); flex-shrink:0}
.striplabel{font:600 12px "Space Grotesk",sans-serif; text-transform:uppercase; letter-spacing:0.1em; color:var(--a)}
.stripsum{font-size:12px; color:var(--m)}
.striprow{display:grid; grid-template-columns:44px 1fr auto auto; gap:16px; align-items:center;
  padding:13px 20px; border-top:1px solid var(--ad); cursor:pointer; background:none; width:100%; border-left:none; border-right:none; border-bottom:none; text-align:left; font:inherit; color:inherit}
.striprow:hover{background:var(--abh)}
.striprow .q{font-size:15px; text-wrap:pretty}
.striprow .dom{font-size:12px; color:var(--m)}
.striprow .due{font:500 12px "IBM Plex Mono",monospace; color:var(--a); white-space:nowrap}

/* ---------- list header + toolbar ---------- */
.listhead{margin:32px 0 16px; display:flex; gap:12px; align-items:center}
.listhead h2{font:600 15px "Space Grotesk",sans-serif; margin:0; white-space:nowrap; flex-shrink:0}
.rule{height:1px; background:var(--d); flex:1}
.newbtn{font:600 12px "IBM Plex Sans",sans-serif; color:var(--onG); background:var(--g); border:none;
  border-radius:8px; padding:7px 13px; white-space:nowrap; flex-shrink:0}
.toolbar{margin-bottom:18px; padding:10px 12px; border:1px solid var(--d); border-radius:12px;
  background:var(--s); display:flex; flex-wrap:wrap; gap:10px; align-items:center}
.tgroup{display:flex; gap:6px; align-items:center; flex-shrink:0; white-space:nowrap}
.tlabel{font-size:11px; text-transform:uppercase; color:var(--dm)}
.tdivider{width:1px; height:22px; background:var(--d); flex-shrink:0}
.searchwrap{flex:1; min-width:0; display:flex; gap:8px; align-items:center}
.searchwrap .glyph{font-size:13px; color:var(--dm)}
.searchwrap input{flex:1; min-width:0; border:none; background:transparent; font-size:13px; color:var(--t); outline:none}
.pill{font:500 12px "IBM Plex Sans",sans-serif; padding:5px 10px; border-radius:7px;
  white-space:nowrap; flex-shrink:0; border:1px solid var(--d); background:transparent; color:var(--m)}
.pill[aria-pressed="true"]{border-color:transparent; background:var(--s2); color:var(--t)}
.pill.blue[aria-pressed="true"]{background:var(--ub); color:var(--u)}
.pill.purple[aria-pressed="true"]{background:var(--pb); color:var(--p)}
.clearbtn{font-size:12px; color:var(--m); text-decoration:underline; border:none; background:none}

/* ---------- composer ---------- */
.composer{margin-bottom:20px; border:1px solid var(--d2); border-radius:14px; background:var(--s);
  padding:18px 20px; animation:oqfade 180ms ease-out}
.ctoggle{display:flex; gap:8px; margin-bottom:14px}
.ctoggle button{font:600 12px "IBM Plex Sans",sans-serif; padding:7px 13px; border-radius:8px;
  border:1px solid var(--d); background:var(--s); color:var(--m)}
.ctoggle button.oq-on{border-color:transparent; background:var(--ub); color:var(--u)}
.ctoggle button.cn-on{border-color:transparent; background:var(--pb); color:var(--p)}
.cq{width:100%; background:var(--s2); border:1px solid var(--d); border-radius:9px; padding:12px 14px;
  font-size:15px; color:var(--t); margin-bottom:10px; outline:none}
.crow{display:grid; grid-template-columns:1fr 1fr 1fr auto; gap:10px}
.crow input{background:var(--s2); border:1px solid var(--d); border-radius:9px; padding:10px 12px;
  font-size:13px; color:var(--t); outline:none; min-width:0}
.crow .due-in{font-family:"IBM Plex Mono",monospace}
.caddbtn{font:600 13px "IBM Plex Sans",sans-serif; color:var(--onG); background:var(--g); border:none;
  border-radius:9px; padding:0 20px; white-space:nowrap}

/* ---------- groups & rows ---------- */
.group{margin-bottom:26px}
.ghead{width:100%; border:none; background:none; padding:0 0 10px; display:flex; gap:10px; align-items:center; text-align:left}
.gcaret{font-size:10px; color:var(--dm); width:10px; flex-shrink:0}
.gname{font:600 12px "Space Grotesk",sans-serif; text-transform:uppercase; letter-spacing:0.1em; color:var(--m)}
.gcount{font:400 11px "IBM Plex Mono",monospace; color:var(--dm)}
.grows{display:flex; flex-direction:column; gap:8px}
.row{border:1px solid var(--d); border-radius:12px; background:var(--s); overflow:hidden}
.rsum{display:grid; grid-template-columns:44px 1fr auto auto 14px; gap:16px; align-items:center;
  padding:14px 18px; cursor:pointer; width:100%; border:none; background:none; text-align:left; font:inherit; color:inherit}
.rsum:hover{background:var(--h)}
.typechip{font:500 11px "IBM Plex Mono",monospace; border-radius:5px; padding:3px 0; text-align:center; border:1px solid}
.typechip.cn{color:var(--p); border-color:var(--pd)}
.typechip.oq{color:var(--u); border-color:var(--ud)}
.rq{font-size:15px; line-height:1.45; text-wrap:pretty; color:var(--t)}
.rq.resolved{color:var(--m)}
.badge{font:600 11px "IBM Plex Sans",sans-serif; letter-spacing:0.03em; border-radius:6px;
  padding:4px 9px; white-space:nowrap}
.badge.open{color:var(--m); background:var(--s2)}
.badge.needs{color:var(--u); background:var(--ub)}
.badge.standing{color:var(--p); background:var(--pb)}
.badge.resolved{color:var(--g); background:var(--gb)}
.badge.reopened{color:var(--a); background:var(--ab)}
.rdue{font:400 12px "IBM Plex Mono",monospace; white-space:nowrap; color:var(--dm)}
.rdue.over{color:var(--a)}
.rcaret{font-size:10px; color:var(--dm)}
.rdetail{border-top:1px solid var(--d); padding:18px; background:var(--s3); animation:oqfade 160ms ease-out}
.eyebrow{font-size:10px; text-transform:uppercase; letter-spacing:0.12em; color:var(--dm); margin-bottom:8px}
.cngrid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; margin-bottom:16px}
.claim{border:1px solid var(--pd); border-radius:10px; background:var(--pb); padding:14px}
.claim .eyebrow{color:var(--p)}
.claim .body{font-size:14px; line-height:1.55}
.claim .body.empty{color:var(--dm); font-style:italic}
.claim .src{font:400 11px "IBM Plex Mono",monospace; color:var(--m); margin-top:10px}
.respane{border:1px dashed var(--d2); border-radius:10px; background:var(--s); padding:14px}
.respane textarea{width:100%; border:none; background:transparent; min-height:76px; resize:vertical;
  font-size:14px; line-height:1.55; color:var(--t); outline:none}
.spawn{display:flex; flex-wrap:wrap; gap:8px}
.spawnchip{font-size:12px; color:var(--u); border:1px solid var(--ud); background:var(--ub);
  border-radius:7px; padding:6px 10px}
.oqgrid{display:grid; grid-template-columns:1fr 260px; gap:24px; margin-bottom:16px}
.note{display:grid; grid-template-columns:78px 1fr; gap:12px; align-items:start}
.note .nd{font:400 11px "IBM Plex Mono",monospace; color:var(--dm); padding-top:2px}
.note .nt{font-size:14px; line-height:1.55; text-wrap:pretty}
.notes{display:flex; flex-direction:column; gap:10px; margin-bottom:12px}
.noteinput{width:100%; background:var(--s); border:1px solid var(--d); border-radius:9px;
  padding:10px 12px; font-size:13px; color:var(--t); outline:none}
.pagelinks{display:flex; flex-direction:column; gap:6px; margin-bottom:16px}
.pagelinks a{font-size:13px; color:var(--u); text-decoration:none}
.pagelinks a:hover{text-decoration:underline}
.agev{font:400 13px "IBM Plex Mono",monospace; color:var(--m)}
.actionbar{padding-top:14px; border-top:1px solid var(--d); display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.abtn{font:600 12px "IBM Plex Sans",sans-serif; padding:8px 14px; border-radius:8px;
  white-space:nowrap; flex-shrink:0; border:1px solid var(--d); background:var(--s); color:var(--m)}
.abtn.on-resolved{border-color:transparent; background:var(--gb); color:var(--g)}
.abtn.on-reopened{border-color:transparent; background:var(--ab); color:var(--a)}
.abtn.on-needs{border-color:transparent; background:var(--ub); color:var(--u)}
.abtn.on-standing{border-color:transparent; background:var(--pb); color:var(--p)}
.rowid{font:400 11px "IBM Plex Mono",monospace; color:var(--dm); margin-left:auto}
.irregular{font-size:12px; color:var(--dm); font-style:italic}

/* ---------- empty state ---------- */
.empty{text-align:center; padding:72px 0; color:var(--dm)}
.empty .e1{font:500 16px "Space Grotesk",sans-serif; color:var(--m); margin-bottom:6px}
.empty .e2{font-size:13px}

/* ---------- connection panel ---------- */
.scrim{position:fixed; inset:0; background:rgba(20,22,26,0.42); z-index:40}
.panel{position:fixed; top:0; right:0; bottom:0; width:420px; max-width:100vw; z-index:50; background:var(--s);
  border-left:1px solid var(--d); padding:28px; overflow:auto}
.panelhead{display:flex; align-items:center; margin-bottom:20px}
.panelhead h3{font:600 16px "Space Grotesk",sans-serif; margin:0; flex:1}
.xbtn{border:none; background:none; font-size:18px; color:var(--dm)}
.connpill{padding:11px 14px; border:1px solid var(--gd); background:var(--gb); border-radius:10px;
  margin-bottom:20px; display:flex; gap:10px; align-items:center}
.connpill.off{border-color:var(--ad); background:var(--ab)}
.conndot{width:7px; height:7px; border-radius:99px; background:var(--g); flex-shrink:0}
.connpill.off .conndot{background:var(--a)}
.conntext{font-size:13px; color:var(--g); flex:1}
.connpill.off .conntext{color:var(--a)}
.connsync{font:400 11px "IBM Plex Mono",monospace; color:var(--m)}
.panel label{display:block; font-size:12px; color:var(--m); margin-bottom:6px}
.tokin{width:100%; background:var(--s2); border:1px solid var(--d); border-radius:9px;
  padding:11px 13px; font:400 13px "IBM Plex Mono",monospace; color:var(--t); outline:none; margin-bottom:12px}
.panelbtns{display:flex; gap:8px; margin-bottom:20px}
.savebtn{flex:1; font:600 13px "IBM Plex Sans",sans-serif; color:var(--onG); background:var(--g);
  border:none; border-radius:9px; padding:10px}
.forgetbtn{font:600 13px "IBM Plex Sans",sans-serif; color:var(--r); border:1px solid var(--rd);
  background:transparent; border-radius:9px; padding:10px 14px}
.help{font-size:12px; line-height:1.7; color:var(--m); border-top:1px solid var(--d); padding-top:18px}
.help b{color:var(--t); font-weight:600}
.help a{color:var(--u)}

#toast{position:fixed; left:50%; bottom:28px; transform:translateX(-50%); background:var(--s);
  border:1px solid var(--d2); color:var(--t); padding:9px 16px; border-radius:9px; font-size:13px;
  z-index:60; display:none; max-width:86vw; text-align:center}

/* ---------- responsive ---------- */
@media (max-width:700px){
  .wrap{padding:0 14px 96px}
  .hrow{padding:14px 14px 0; gap:10px; flex-wrap:wrap}
  .tabs{padding:0 14px}
  .cngrid,.oqgrid{grid-template-columns:1fr}
  .rsum{grid-template-columns:44px 1fr auto 14px}
  .rsum .rdue{display:none}
  .striprow{grid-template-columns:44px 1fr auto}
  .striprow .dom{display:none}
  .crow{grid-template-columns:1fr 1fr}
  .panel{width:100vw}
}
</style>
</head>
<body>

<header>
  <div class="hrow">
    <div class="htitle">OQ Register</div>
    <div class="hsync" id="synclabel">not synced</div>
    <div class="hspace"></div>
    <div class="prog" id="progcard">
      <div class="pl"><span>Cleared this week</span><span class="pcount" id="pcount">0/5</span></div>
      <div class="ptrack"><div class="pfill" id="pfill" style="width:0%"></div></div>
    </div>
    <button class="ibtn" id="themebtn" title="Theme">☾</button>
    <button class="ibtn" id="syncbtn" title="Sync">⟳</button>
    <button class="ibtn" id="connbtn" title="Connection">⚙</button>
  </div>
  <nav class="tabs" role="tablist" id="tabs"></nav>
</header>

<div class="wrap">
  <div id="strip"></div>
  <div class="listhead">
    <h2 id="listtitle">Open questions</h2>
    <div class="rule"></div>
    <button class="newbtn" id="newbtn">＋ New row</button>
  </div>
  <div id="composer"></div>
  <div class="toolbar" id="toolbar"></div>
  <div id="list"></div>
</div>

<div id="panelroot"></div>
<div id="toast"></div>

<script>
'use strict';
/* ================= GitHub I/O (unchanged machinery) ================= */
const OWNER='nesks-ai', REPO='llm-wiki', BRANCH='main';
const PATH='wiki/synthesis/Open-Questions-and-Contradictions.md';
const API=`https://api.github.com/repos/${OWNER}/${REPO}/contents/${encodeURIComponent(PATH).replace(/%2F/g,'/')}`;
const TOKEN_KEY='oq_gh_token';
const SECTIONS={
  CN:{heading:'## Contradictions (CN-xxx)', left:['id','raised','domain'], right:['pages','status','resolution']},
  OQ:{heading:'## Open questions & decision gates (OQ-xxx)', left:['id','raised','due','domain'], right:['pages','status','resolution']},
  AR:{heading:'## Resolved (archive)', left:['id','raised','resolved','domain'], right:['pages','resolution']}
};
const STATUS_RE=/OPEN|OVERDUE|RESOLVED|CLOSED|STANDING|REOPENED|⏰|✅|❌|🙋|^—$|^\s*$/i;
let lines=[], EOL='\n', sha=null, model={CN:[],OQ:[],AR:[]}, fmUpdated='', lastSync=null;

const $=id=>document.getElementById(id);
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
function toast(msg,ms=2600){const t=$('toast');t.textContent=msg;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',ms);}
function b64decode(b64){const bin=atob(b64.replace(/\n/g,''));const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);return new TextDecoder('utf-8').decode(bytes);}
function b64encode(str){const bytes=new TextEncoder().encode(str);let bin='';for(let i=0;i<bytes.length;i+=0x8000)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));return btoa(bin);}
function escHtml(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function splitCells(line){return line.split(/(?<!\\)\|/);}
function esc4cell(s){return s.replace(/\|/g,'\\|').replace(/\r?\n/g,' ');}
function render(md){
  let h=escHtml(md);
  h=h.replace(/\[\[([^\]]+?)\\\|([^\]]+?)\]\]/g,'<span style="color:var(--u)">$2</span>');
  h=h.replace(/\[\[([^\]]+?)\]\]/g,'<span style="color:var(--u)">$1</span>');
  h=h.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
  h=h.replace(/`([^`]+)`/g,'<code>$1</code>');
  h=h.replace(/\\\|/g,'|');
  return h;
}
function dateIn(s){const m=(s||'').match(/\d{4}-\d{2}-\d{2}/);return m?m[0]:null;}

function statusKey(row){
  const s=row.status||'';
  if(/RESOLVED/i.test(s))return'resolved';
  if(/REOPENED/i.test(s))return'reopened';
  if(/STANDING/i.test(s))return'standing';
  if(/🙋/.test(s))return'needs';
  return'open'; // stored ⏰ OVERDUE maps to open; overdue is derived from the date
}
function parseNotes(cell,created){
  if(!cell||cell.trim()==='—'||cell.trim()==='')return[];
  const parts=cell.split(/(?=(?:📝|✅)\s*\d{4}-\d{2}-\d{2})/);
  const notes=[];
  for(const p of parts){
    const m=p.match(/^(?:📝|✅)\s*(\d{4}-\d{2}-\d{2}):?\s*([\s\S]*)$/);
    if(m)notes.push({date:m[1],text:m[2].trim()||'(status change)'});
    else if(p.trim())notes.push({date:created||'',text:p.trim()});
  }
  return notes;
}
function parsePages(cell){
  if(!cell)return[];
  const out=[];const re=/\[\[([^\]\\|]+?)(?:\\\|[^\]]*)?\]\]/g;let m;
  while((m=re.exec(cell)))out.push(m[1].trim());
  return out;
}
function parse(content){
  EOL=content.includes('\r\n')?'\r\n':'\n';
  lines=content.split(EOL);
  model={CN:[],OQ:[],AR:[]};
  const upd=lines.findIndex(l=>l.startsWith('updated:'));
  fmUpdated=upd>=0?lines[upd].slice(8).trim():'';
  for(const key of Object.keys(SECTIONS)){
    const sec=SECTIONS[key];
    const start=lines.findIndex(l=>l.trim()===sec.heading);
    if(start<0)continue;
    let end=lines.length;
    for(let i=start+1;i<lines.length;i++){if(lines[i].startsWith('## ')){end=i;break;}}
    for(let i=start+1;i<end;i++){
      const l=lines[i];
      const idm=l.match(/^\|\s*(CN|OQ)-\d+/);
      if(!idm)continue;
      const bucket=key==='AR'?'AR':idm[1];
      const layout=key==='AR'?SECTIONS.AR:SECTIONS[idm[1]];
      const cells=splitCells(l);
      const trail=cells.length>1&&cells[cells.length-1].trim()===''?1:0;
      const cc=cells.slice(1,cells.length-trail);
      const L=layout.left, R=layout.right, full=L.length+R.length+1;
      const row={line:i, section:bucket, type:idm[1], cells, ccStart:1, ccLen:cc.length, rlen:R.length};
      if(cc.length>=full){
        L.forEach((c,idx)=>row[c]=cc[idx].trim());
        R.forEach((c,idx)=>row[c]=cc[cc.length-R.length+idx].trim());
        row.text=cc.slice(L.length,cc.length-R.length).join('|').trim();
        row.editable=cc.length===full||key==='AR'||STATUS_RE.test(row.status||'');
        if(!row.editable){row.text=cc.slice(L.length).join('|').trim();row.pages='';row.status='';row.resolution='';}
      }else{
        L.forEach((c,idx)=>row[c]=(cc[idx]||'').trim());
        row.text=cc.slice(L.length).join('|').trim();
        row.pages='';row.status=row.status||'';row.resolution='';
        row.editable=false;
      }
      // derived view-model fields
      row.created=dateIn(row.raised)||'';
      row.dueDate=dateIn(row.due)||'';
      row.sk=key==='AR'?'resolved':statusKey(row);
      row.resolvedDate=key==='AR'?(dateIn(row.resolved)||''):(row.sk==='resolved'?(dateIn(row.status)||''):'');
      row.notes=parseNotes(row.resolution,row.created);
      row.pagesList=parsePages(row.pages);
      model[bucket].push(row);
    }
  }
}
function nextId(prefix){
  let max=0;
  for(const l of lines){const re=new RegExp(prefix+'-(\\d+)','g');let m;while((m=re.exec(l)))max=Math.max(max,+m[1]);}
  return prefix+'-'+String(max+1).padStart(3,'0');
}
function setCell(row,col,val){
  if(!row.editable)return;
  const sec=SECTIONS[row.section];
  let li=sec.left.indexOf(col), ri=sec.right.indexOf(col), idx;
  if(li>=0)idx=row.ccStart+li;
  else if(ri>=0)idx=row.ccStart+row.ccLen-row.rlen+ri;
  else return;
  row.cells[idx]=' '+esc4cell(val)+' ';
  lines[row.line]=row.cells.join('|');
  row[col]=val;
}
function bumpUpdated(note){
  const i=lines.findIndex(l=>l.startsWith('updated:'));
  if(i>=0)lines[i]=`updated: ${today()} (live register: ${note})`;
}
function token(){return localStorage.getItem(TOKEN_KEY)||'';}
const GH=`https://api.github.com/repos/${OWNER}/${REPO}`;
function ghHeaders(){return {Authorization:'Bearer '+token(),Accept:'application/vnd.github+json'};}
// The register crossed 1 MiB on 2026-08-24. Above that the contents API silently returns an
// EMPTY content field (encoding:"none") — which rendered the whole app blank. So reads fall
// back to the blob API (good to 100 MB) and large writes go through the Git Data API.
const PUT_LIMIT=900000;
async function ghFetch(){
  const r=await fetch(API+'?ref='+BRANCH,{headers:ghHeaders(),cache:'no-store'});
  if(r.status===401||r.status===403)throw new Error('AUTH');
  if(r.status===404)throw new Error('Not found — token may lack access to '+REPO);
  if(!r.ok)throw new Error('GitHub '+r.status);
  const j=await r.json();
  sha=j.sha;
  let content='';
  if(j.content&&j.encoding==='base64'){content=b64decode(j.content);}
  else{
    const b=await fetch(`${GH}/git/blobs/${j.sha}`,{headers:ghHeaders(),cache:'no-store'});
    if(b.status===401||b.status===403)throw new Error('AUTH');
    if(!b.ok)throw new Error('Blob read '+b.status);
    const bj=await b.json();
    if(!bj.content)throw new Error('Blob returned no content');
    content=b64decode(bj.content);
  }
  // never render an empty register silently again — fail loud instead
  if(!content.trim())throw new Error('Register came back empty — not rendering');
  parse(content);
  lastSync=Date.now();
}
async function ghPut(message){
  const payload=lines.join(EOL);
  if(payload.length>PUT_LIMIT)return ghPutGitData(message,payload);
  const body={message:'live-OQ: '+message, content:b64encode(payload), sha, branch:BRANCH};
  const r=await fetch(API,{method:'PUT',headers:ghHeaders(),body:JSON.stringify(body)});
  if(r.status===409||r.status===422)throw new Error('CONFLICT');
  if(!r.ok)throw new Error('GitHub write '+r.status);
  const j=await r.json();
  sha=j.content.sha;
}
// blob -> tree -> commit -> fast-forward ref. Additive by construction: base_tree keeps every
// other file, and force:false makes a moved branch fail as CONFLICT rather than clobber it.
async function ghPutGitData(message,payload){
  const H=ghHeaders(), J=Object.assign({'Content-Type':'application/json'},H);
  const step=async(url,opt,label)=>{
    const r=await fetch(url,opt);
    if(r.status===401||r.status===403)throw new Error('AUTH');
    if(!r.ok)throw new Error(label+' '+r.status);
    return r.json();
  };
  const ref=await step(`${GH}/git/ref/heads/${BRANCH}`,{headers:H,cache:'no-store'},'ref read');
  const head=ref.object.sha;
  const headCommit=await step(`${GH}/git/commits/${head}`,{headers:H,cache:'no-store'},'commit read');
  const blob=await step(`${GH}/git/blobs`,{method:'POST',headers:J,
    body:JSON.stringify({content:b64encode(payload),encoding:'base64'})},'blob write');
  const tree=await step(`${GH}/git/trees`,{method:'POST',headers:J,
    body:JSON.stringify({base_tree:headCommit.tree.sha,
      tree:[{path:PATH,mode:'100644',type:'blob',sha:blob.sha}]})},'tree write');
  const cm=await step(`${GH}/git/commits`,{method:'POST',headers:J,
    body:JSON.stringify({message:'live-OQ: '+message,tree:tree.sha,parents:[head]})},'commit write');
  const upd=await fetch(`${GH}/git/refs/heads/${BRANCH}`,{method:'PATCH',headers:J,
    body:JSON.stringify({sha:cm.sha,force:false})});
  if(upd.status===422)throw new Error('CONFLICT');
  if(!upd.ok)throw new Error('ref update '+upd.status);
  sha=blob.sha;
}
async function commit(op,message){
  try{
    op(); bumpUpdated(message);
    try{ await ghPut(message); }
    catch(e){
      if(e.message!=='CONFLICT')throw e;
      toast('File changed remotely — re-syncing…');
      await ghFetch(); op(); bumpUpdated(message);
      await ghPut(message);
    }
    parse(lines.join(EOL));
    draw(); toast('✓ '+message);
  }catch(e){
    if(e.message==='AUTH'){toast('Token rejected — check connection');S.settingsOpen=true;drawPanel();}
    else toast('Failed: '+e.message,4000);
    try{await ghFetch();draw();}catch(_){}
  }
}

/* ================= derived data ================= */
function liveRows(){return[...model.OQ,...model.CN];}
function tabRows(){
  if(S.tab==='AR')return[...model.AR,...liveRows().filter(r=>r.sk==='resolved')];
  return model[S.tab].filter(r=>r.sk!=='resolved');
}
function tabCounts(){
  return{OQ:model.OQ.filter(r=>r.sk!=='resolved').length,
         CN:model.CN.filter(r=>r.sk!=='resolved').length,
         AR:model.AR.length+liveRows().filter(r=>r.sk==='resolved').length};
}
function overdueRows(){
  const t=today();
  return liveRows().filter(r=>r.sk!=='resolved'&&r.dueDate&&r.dueDate<t)
    .sort((a,b)=>a.dueDate<b.dueDate?-1:1);
}
function clearedThisWeek(){
  const d=new Date();const dow=(d.getDay()+6)%7; // Mon=0
  const mon=new Date(d);mon.setDate(d.getDate()-dow);
  const monS=mon.getFullYear()+'-'+String(mon.getMonth()+1).padStart(2,'0')+'-'+String(mon.getDate()).padStart(2,'0');
  return[...liveRows(),...model.AR].filter(r=>r.resolvedDate&&r.resolvedDate>=monS).length;
}
function dueLabel(r){
  if(!r.dueDate)return'no date';
  const ms=new Date(r.dueDate)-new Date(today());
  const n=Math.round(ms/86400000);
  if(n<-1)return(-n)+'d over'; if(n===-1)return'1d over';
  if(n===0)return'today'; if(n===1)return'tomorrow';
  if(n<14)return'in '+n+'d';
  return r.dueDate.slice(5,7)+'/'+r.dueDate.slice(8,10);
}
function matches(r){
  if(S.domainFilter&&r.domain!==S.domainFilter)return false;
  if(S.statusFilter&&r.sk!==S.statusFilter)return false;
  const q=S.query.trim().toLowerCase();
  if(q&&!((r.id+' '+r.text+' '+r.domain+' '+(r.pages||'')+' '+(r.resolution||'')).toLowerCase().includes(q)))return false;
  return true;
}
function sortRows(rows){
  const c={
    due:(a,b)=>(a.dueDate||'9999')<(b.dueDate||'9999')?-1:(a.dueDate||'9999')>(b.dueDate||'9999')?1:0,
    age:(a,b)=>(a.created||'9999')<(b.created||'9999')?-1:1,
    domain:(a,b)=>a.domain.localeCompare(b.domain)
  }[S.sort];
  return[...rows].sort((a,b)=>c(a,b)||b.id.localeCompare(a.id,undefined,{numeric:true}));
}
function grouped(){
  const rows=tabRows().filter(matches);
  const dated=rows.filter(r=>r.dueDate), undated=rows.filter(r=>!r.dueDate);
  const groups=[];
  if(S.grouping==='domain'){
    const names=[];
    for(const r of dated)if(!names.includes(r.domain))names.push(r.domain);
    for(const n of names)groups.push({name:n,rows:sortRows(dated.filter(r=>r.domain===n))});
  }else if(dated.length){
    groups.push({name:'By date',rows:sortRows(dated)});
  }
  if(undated.length)groups.push({name:'No date',rows:sortRows(undated)});
  return groups;
}

function addRow(){
  const q=S.draftQ.trim();
  if(!q)return;
  const type=S.composerType, domain=S.draftDomain.trim()||'Cross';
  const due=dateIn(S.draftDue)||'—', pages=S.draftPages.trim()||'—';
  let newId='';
  commit(()=>{
    newId=nextId(type);
    const c=esc4cell;
    const rowLine=type==='CN'
      ?`| ${newId} | ${today()} | ${c(domain)} | ${c(q)} | ${c(pages)} | OPEN | — |`
      :`| ${newId} | ${today()} | ${c(due)} | ${c(domain)} | ${c(q)} | ${c(pages)} | OPEN | — |`;
    const sec=SECTIONS[type];
    const start=lines.findIndex(l=>l.trim()===sec.heading);
    let end=lines.length;
    for(let i=start+1;i<lines.length;i++){if(lines[i].startsWith('## ')){end=i;break;}}
    let last=-1;
    for(let i=start+1;i<end;i++)if(/^\|\s*(CN|OQ)-\d+/.test(lines[i]))last=i;
    lines.splice(last>=0?last+1:start+3,0,rowLine);
  },(newId||type)+' raised from live register');
  S.tab=type; S.composerOpen=false;
  S.draftQ=S.draftDomain=S.draftDue=S.draftPages='';
}

/* ================= events (delegated) ================= */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab],[data-open],[data-g],[data-dom],[data-st],[data-sort],[data-group],[data-ct],[data-act],#newbtn,#caddbtn,#clearbtn,#themebtn,#syncbtn,#connbtn,#scrim,#xbtn,#savetok,#forgettok');
  if(!t)return;
  if(t.dataset.tab){S.tab=t.dataset.tab;S.openId=null;draw();return;}
  if(t.dataset.open!==undefined&&t.dataset.open){
    const r=findRow(t.dataset.open);
    if(r&&r.section!=='AR'&&S.tab!=='AR'&&r.type!==S.tab)S.tab=r.type;
    S.openId=S.openId===t.dataset.open?null:t.dataset.open;
    drawMain(false);return;}
  if(t.dataset.g){S.openGroups[t.dataset.g]=S.openGroups[t.dataset.g]===false;drawMain(false);return;}
  if(t.dataset.dom){S.domainFilter=t.dataset.dom==='*'?null:t.dataset.dom;drawMain();return;}
  if(t.dataset.st){S.statusFilter=t.dataset.st==='*'?null:t.dataset.st;drawMain();return;}
  if(t.dataset.sort){S.sort=t.dataset.sort;drawMain();return;}
  if(t.dataset.group){S.grouping=S.grouping==='domain'?'date':'domain';drawMain();return;}
  if(t.dataset.ct){S.composerType=t.dataset.ct;syncDrafts();drawComposer();return;}
  if(t.dataset.act){e.stopPropagation();setStatus(findRow(t.dataset.id),t.dataset.act);return;}
  switch(t.id){
    case'newbtn':S.composerOpen=!S.composerOpen;drawComposer();break;
    case'caddbtn':syncDrafts();addRow();break;
    case'clearbtn':S.query='';S.domainFilter=null;S.statusFilter=null;S.sort='due';drawMain();break;
    case'themebtn':S.theme=S.theme==='dark'?'light':'dark';localStorage.setItem('oq_theme',S.theme);applyTheme();break;
    case'syncbtn':load();break;
    case'connbtn':S.settingsOpen=true;drawPanel();break;
    case'scrim':case'xbtn':S.settingsOpen=false;drawPanel();break;
    case'savetok':localStorage.setItem(TOKEN_KEY,document.getElementById('tokin').value.trim());S.settingsOpen=false;drawPanel();load();break;
    case'forgettok':localStorage.removeItem(TOKEN_KEY);toast('Token cleared');drawPanel();break;
  }
});
function syncDrafts(){
  const g=id=>{const el=$(id);return el?el.value:'';};
  S.draftQ=g('draftq');S.draftDomain=g('draftdomain');S.draftDue=g('draftdue');S.draftPages=g('draftpages');
}
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  const n=e.target.closest('[data-note]');
  if(n&&n.value.trim()){const r=findRow(n.dataset.note);S.drafts['n'+r.id]='';appendNote(r,n.value.trim());}
  if(e.target.id==='draftq'||e.target.closest('.crow')){if(e.target.tagName==='INPUT'){syncDrafts();addRow();}}
});
document.addEventListener('input',e=>{
  const n=e.target.closest('[data-note]');if(n)S.drafts['n'+n.dataset.note]=n.value;
  const rr=e.target.closest('[data-res]');if(rr)S.drafts['r'+rr.dataset.res]=rr.value;
});
document.addEventListener('focusout',e=>{
  const rr=e.target.closest&&e.target.closest('[data-res]');
  if(rr){const r=findRow(rr.dataset.res);
    const orig=(r.resolution&&r.resolution!=='—')?r.resolution.replace(/\\\|/g,'|'):'';
    if(rr.value.trim()!==orig.trim()){delete S.drafts['r'+r.id];saveResolution(r,rr.value);}}
});
setInterval(()=>{if(lastSync)$('synclabel').textContent='synced '+syncAgo();},30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&token())load(true);});

/* ================= boot ================= */
async function load(quiet){
  if(!token()){
    if(location.hostname==='localhost'||location.hostname==='127.0.0.1'){
      try{const r=await fetch('oq.md');if(r.ok){window.__loadMarkdown(await r.text());return;}}catch(_){}
    }
    S.settingsOpen=true;draw();return;
  }
  try{await ghFetch();draw();if(!quiet)toast('Synced');}
  catch(e){
    if(e.message==='AUTH'){toast('Token needed / rejected');S.settingsOpen=true;draw();}
    else toast('Load failed: '+e.message,4000);
  }
}
window.__loadMarkdown=md=>{parse(md);lastSync=Date.now();draw();};
const __tq=new URLSearchParams(location.search).get('theme');
if(__tq==='light'||__tq==='dark')S.theme=__tq;
applyTheme();
draw();
load();
</script>
</body>
